<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>You are offline · Shanda Fuel</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #f6f6f5;
        color: #1b1b1a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #131312;
          color: #ececea;
        }
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.75rem;
      }
      p {
        line-height: 1.5;
        margin: 0 0 0.75rem;
      }
      button {
        font: inherit;
        padding: 0.7rem 1.1rem;
        border-radius: 0.5rem;
        border: 0;
        background: #0a5a4a;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>There is no internet connection right now, so this page cannot load.</p>
      <p>
        Anything you already typed on the daily operations screen stays on this phone. A daily
        report you saved while offline is sent by itself when the connection comes back.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
