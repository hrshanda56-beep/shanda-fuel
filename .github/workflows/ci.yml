name: CI

on:
  push:
    branches: [main, 'agent/**', 'prep/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shanda_fuel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shanda_fuel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: integration-only-better-auth-secret-32-bytes
      AUDIT_SIGNING_KEY_ID: integration-ci-audit-key
      AUDIT_SIGNING_KEY: integration-ci-audit-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shanda_fuel_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/shanda_fuel_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for PostgreSQL
        run: pg_isready --host 127.0.0.1 --port 5432 --username postgres --dbname shanda_fuel_test
      - name: Bootstrap database roles
        run: scripts/db/bootstrap-test.sh
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate:test
      - name: Assign migration metadata ownership
        run: psql "$DATABASE_DIRECT_URL" --set ON_ERROR_STOP=1 --command "ALTER SCHEMA drizzle OWNER TO migration_owner; ALTER TABLE drizzle.__drizzle_migrations OWNER TO migration_owner;"
      - run: pnpm db:check
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
